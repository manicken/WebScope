<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebScope — logic analyzer</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="js/libs/internal/ContextMenu.css" />
<link rel="stylesheet" href="js/libs/internal/AppWindows/AppWindow.css" />
<link rel="stylesheet" href="js/libs/internal/menu/menu.css" />
<link rel="stylesheet" href="js/libs/internal/button-bar/button-bar.css" />
<link rel="stylesheet" href="js/selections/selections.css" />
<link rel="stylesheet" href="js/markers/markers.css" />
<link rel="stylesheet" href="js/capture/capturePanel.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">WebScope</span>
    <div id="mainMenu" class="main-menu"></div>
    
    <span class="sep"></span>
    <span class="spacer"></span>
    <!--<label>Rate <select id="samplerateSelect" style="width:110px"></select></label>-->
    <!--<label>Duration (s) <input id="durationIn" type="number" value="1" step="0.01" /></label>-->

    <button id="captureBtn" class="primary">Start</button>
    <span id="statusPill" class="status-pill">idle</span>
    <!--<div id="test">idle</div>-->
    
    <span class="spacer"></span>
    <span id="connectionStatusPill" class="status-pill error">disconnected</span>
    <input id="wsUrlInput" type="text"/>
    <button id="wsConnectBtn" title="(Re)Connect to the websocket server">⇄</button>'
    <span class="sep"></span>
    <button id="fitBtn">Fit</button>
  </div>

  <!-- the device picker: shown in the Capture panel's header (capturePanel.js moves it there) -->
  <div hidden>
    <div id="devicePicker" class="cp-device-picker">
      <select id="deviceSelect" class="cp-select" title="Capture device"></select>
      <button id="devicesRefreshBtn" class="cp-step" title="Look for devices again">↻</button>
    </div>
  </div>

  <div class="main">
    <div class="gutter" id="gutter">
      <div class="gutter-head"><span>Channels</span></div>
      <div id="gutterBody"></div>
    </div>
    <div class="plot-col">
      <div class="overview"><canvas id="overviewCanvas"></canvas></div>
      <div class="plot-wrap" id="plotWrap">
        <canvas id="canvas"></canvas>
        <div id="hoverTip" class="hover-tip" style="display:none"></div>
        <div id="emptyState" class="empty">
          <div class="empty-title">No capture yet</div>
          <div class="empty-sub">Pick a source above, then press <kbd>Start</kbd></div>
        </div>
      </div>
    </div>
    <aside class="right-panel" id="rightPanel"></aside>
  </div>

  <div class="statusbar">
    <span>Sample Count <b id="stSamples">—</b></span>
    <span>Rate <b id="stRate">—</b></span>
    <span>Sample resolution <b id="stSampleResolution">—</b></span>
    <span>View <b id="stView">—</b></span>
    <span class="spacer"></span>
    <span class="muted keys" id="keyHints"></span>
  </div>
</div>

<!--
  Classic (non-module) scripts, loaded in dependency order, all attaching to one global
  `WS` namespace object (see the (function(WS){...})(window.WS = window.WS || {}) wrapper
  at the top of every file). This is deliberate: `type="module"` scripts are blocked by CORS
  when a page is opened directly via file:// in Chrome/Edge, so plain scripts are what make
  double-click-to-run work. If you'd rather use real ES modules with import/export, switch
  these to type="module" and serve the folder with any static server, e.g. `python3 -m http.server`.
-->
