[package]
name = "webscope-backend"
version = "0.1.0"
edition = "2021"

# Only two direct dependencies:
#   tungstenite - WebSocket framing + handshake helper (sync, no async runtime)
#   serde_json  - JSON for the small control protocol
# HTTP server, static files, /api/fs, demo device and the sigrok-cli wrapper are plain std.
[dependencies]
tungstenite = "0.24"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
